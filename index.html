<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161615">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>German Flashcards</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--muted:#6b6a64;--line:#dcdad2;--btn:#ecebe5;--der:#2b6cb0;--die:#c2410c;--das:#2f855a;--none:#6b6a64;--accent:#1d1d1b;--accent-text:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#222221;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3a37;--btn:#2d2d2b;--der:#63a4ec;--die:#f08a52;--das:#5cc08a;--none:#a3a29a;--accent:#f1f0ea;--accent-text:#161615}}
:root[data-theme="dark"]{--bg:#161615;--card:#222221;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3a37;--btn:#2d2d2b;--der:#63a4ec;--die:#f08a52;--das:#5cc08a;--none:#a3a29a;--accent:#f1f0ea;--accent-text:#161615}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:460px;padding:16px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;cursor:pointer;position:relative}
.gender{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border:1.5px solid currentColor;border-radius:99px}
.word{font-size:40px;font-weight:700;line-height:1.15;word-break:break-word}
.type{color:var(--muted);font-size:14px}
.back{display:none;flex-direction:column;gap:8px;margin-top:10px;width:100%;border-top:1px solid var(--line);padding-top:14px}
.card.open .back{display:flex}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
.card.open .hint{display:none}
.tr{font-size:22px;font-weight:600}
.ex{font-size:17px}
.ex-en{font-size:14px;color:var(--muted)}
.dot{position:absolute;top:14px;right:14px;width:12px;height:12px;border-radius:50%;background:var(--line)}
.row{display:flex;gap:8px}
button{font:inherit;color:var(--text);background:var(--btn);border:1px solid var(--line);border-radius:12px;padding:12px 10px;cursor:pointer;flex:1;min-height:46px}
button:active{transform:scale(.98)}
button.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.label{font-size:13px;color:var(--muted)}
.speak{position:absolute;top:8px;left:8px;flex:none;width:44px;min-height:44px;padding:0;font-size:18px;background:transparent;border:none}
.sound{font-size:12px;color:var(--muted);text-align:center;min-height:16px}
html{-webkit-text-size-adjust:100%}
button,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span id="pos">1 / 1</span><span id="stats"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="row" id="filt"><button data-f="all">All words</button><button data-f="unk">Review unknown</button></div>
  <div class="card" id="card" role="button" tabindex="0" aria-label="Flip card">
    <button class="speak" id="speak" aria-label="Play sound">🔊</button>
    <span class="dot" id="dot"></span>
    <span class="gender" id="gender"></span>
    <div class="word" id="word"></div>
    <div class="type" id="type"></div>
    <div class="hint">Tap the card to see meaning and example</div>
    <div class="back">
      <div class="tr" id="tr"></div>
      <div class="ex" id="ex"></div>
      <div class="ex-en" id="exen"></div>
      <button id="speakEx">🔊 Play sentence</button>
    </div>
  </div>
  <div class="label">How well do you know this word?</div>
  <div class="row" id="prof">
    <button data-p="1">New</button>
    <button data-p="2">Learning</button>
    <button data-p="3">Known</button>
  </div>
  <div class="row">
    <button id="prev">← Back</button>
    <button id="next">Next →</button>
  </div>
  <div class="sound" id="sound"></div>
</div>
<script>
var WORDS=[
{de:"Haus",g:"das",t:"noun",en:"house",s:"Das Haus ist sehr alt.",se:"The house is very old."},
{de:"Hund",g:"der",t:"noun",en:"dog",s:"Der Hund spielt im Garten.",se:"The dog plays in the garden."},
{de:"Katze",g:"die",t:"noun",en:"cat",s:"Die Katze schläft auf dem Sofa.",se:"The cat sleeps on the sofa."},
{de:"Tisch",g:"der",t:"noun",en:"table",s:"Das Buch liegt auf dem Tisch.",se:"The book is lying on the table."},
{de:"Buch",g:"das",t:"noun",en:"book",s:"Ich lese ein interessantes Buch.",se:"I am reading an interesting book."},
{de:"Frau",g:"die",t:"noun",en:"woman",s:"Die Frau arbeitet im Krankenhaus.",se:"The woman works in the hospital."},
{de:"Brot",g:"das",t:"noun",en:"bread",s:"Ich kaufe frisches Brot.",se:"I am buying fresh bread."},
{de:"Schule",g:"die",t:"noun",en:"school",s:"Die Kinder gehen zur Schule.",se:"The children go to school."},
{de:"Apfel",g:"der",t:"noun",en:"apple",s:"Der Apfel schmeckt süß.",se:"The apple tastes sweet."},
{de:"gehen",g:"",t:"verb",en:"to go / to walk",s:"Wir gehen heute ins Kino.",se:"We are going to the cinema today."},
{de:"lernen",g:"",t:"verb",en:"to learn",s:"Ich lerne jeden Tag Deutsch.",se:"I learn German every day."},
{de:"schön",g:"",t:"adjective",en:"beautiful / nice",s:"Das Wetter ist heute schön.",se:"The weather is nice today."},
{de:"Wasser",g:"das",t:"noun",en:"water",s:"Ich trinke ein Glas Wasser.",se:"I drink a glass of water."},
{de:"Straße",g:"die",t:"noun",en:"street",s:"Die Straße ist heute sehr voll.",se:"The street is very busy today."},
{de:"Auto",g:"das",t:"noun",en:"car",s:"Das Auto steht vor dem Haus.",se:"The car is parked in front of the house."},
{de:"Stadt",g:"die",t:"noun",en:"city",s:"Berlin ist eine große Stadt.",se:"Berlin is a big city."},
{de:"Freund",g:"der",t:"noun",en:"friend (male)",s:"Mein Freund wohnt in München.",se:"My friend lives in Munich."},
{de:"Kind",g:"das",t:"noun",en:"child",s:"Das Kind malt ein Bild.",se:"The child is painting a picture."},
{de:"Mann",g:"der",t:"noun",en:"man",s:"Der Mann liest die Zeitung.",se:"The man is reading the newspaper."},
{de:"Arbeit",g:"die",t:"noun",en:"work",s:"Die Arbeit beginnt um acht Uhr.",se:"Work starts at eight o’clock."},
{de:"Zeit",g:"die",t:"noun",en:"time",s:"Ich habe heute keine Zeit.",se:"I have no time today."},
{de:"Tag",g:"der",t:"noun",en:"day",s:"Heute ist ein guter Tag.",se:"Today is a good day."},
{de:"Nacht",g:"die",t:"noun",en:"night",s:"Die Nacht ist kalt und still.",se:"The night is cold and quiet."},
{de:"Essen",g:"das",t:"noun",en:"food / meal",s:"Das Essen ist fertig.",se:"The food is ready."},
{de:"Kaffee",g:"der",t:"noun",en:"coffee",s:"Ich trinke morgens einen Kaffee.",se:"I drink a coffee in the morning."},
{de:"Milch",g:"die",t:"noun",en:"milk",s:"Die Milch steht im Kühlschrank.",se:"The milk is in the fridge."},
{de:"Zug",g:"der",t:"noun",en:"train",s:"Der Zug kommt um zehn Uhr an.",se:"The train arrives at ten o’clock."},
{de:"Bahnhof",g:"der",t:"noun",en:"train station",s:"Wir treffen uns am Bahnhof.",se:"We are meeting at the train station."},
{de:"Fenster",g:"das",t:"noun",en:"window",s:"Bitte mach das Fenster auf.",se:"Please open the window."},
{de:"Tür",g:"die",t:"noun",en:"door",s:"Die Tür ist geschlossen.",se:"The door is closed."},
{de:"Stuhl",g:"der",t:"noun",en:"chair",s:"Der Stuhl ist sehr bequem.",se:"The chair is very comfortable."},
{de:"Wetter",g:"das",t:"noun",en:"weather",s:"Wie ist das Wetter morgen?",se:"What is the weather like tomorrow?"},
{de:"Name",g:"der",t:"noun",en:"name",s:"Mein Name ist Anna.",se:"My name is Anna."},
{de:"Woche",g:"die",t:"noun",en:"week",s:"Die Woche hat sieben Tage.",se:"The week has seven days."},
{de:"Geld",g:"das",t:"noun",en:"money",s:"Ich habe nicht genug Geld.",se:"I don’t have enough money."},
{de:"Familie",g:"die",t:"noun",en:"family",s:"Meine Familie wohnt in Hamburg.",se:"My family lives in Hamburg."},
{de:"Mutter",g:"die",t:"noun",en:"mother",s:"Meine Mutter arbeitet als Lehrerin.",se:"My mother works as a teacher."},
{de:"Vater",g:"der",t:"noun",en:"father",s:"Mein Vater kocht gern.",se:"My father likes to cook."},
{de:"Handy",g:"das",t:"noun",en:"mobile phone",s:"Mein Handy liegt auf dem Tisch.",se:"My phone is on the table."},
{de:"Problem",g:"das",t:"noun",en:"problem",s:"Das ist kein Problem.",se:"That is not a problem."},
{de:"Sprache",g:"die",t:"noun",en:"language",s:"Deutsch ist eine schöne Sprache.",se:"German is a beautiful language."},
{de:"Wort",g:"das",t:"noun",en:"word",s:"Dieses Wort kenne ich nicht.",se:"I don’t know this word."},
{de:"Baum",g:"der",t:"noun",en:"tree",s:"Der Baum im Garten ist sehr hoch.",se:"The tree in the garden is very tall."},
{de:"sein",g:"",t:"verb",en:"to be",s:"Ich bin heute müde.",se:"I am tired today."},
{de:"haben",g:"",t:"verb",en:"to have",s:"Wir haben einen Hund.",se:"We have a dog."},
{de:"machen",g:"",t:"verb",en:"to do / to make",s:"Was machst du am Wochenende?",se:"What are you doing at the weekend?"},
{de:"essen",g:"",t:"verb",en:"to eat",s:"Wir essen um sieben Uhr.",se:"We eat at seven o’clock."},
{de:"trinken",g:"",t:"verb",en:"to drink",s:"Sie trinkt gern Tee.",se:"She likes drinking tea."},
{de:"sprechen",g:"",t:"verb",en:"to speak",s:"Sprichst du Deutsch?",se:"Do you speak German?"},
{de:"kommen",g:"",t:"verb",en:"to come",s:"Er kommt aus Spanien.",se:"He comes from Spain."},
{de:"sehen",g:"",t:"verb",en:"to see",s:"Ich sehe einen Vogel.",se:"I see a bird."},
{de:"wohnen",g:"",t:"verb",en:"to live (reside)",s:"Wir wohnen in einer kleinen Wohnung.",se:"We live in a small apartment."},
{de:"groß",g:"",t:"adjective",en:"big / tall",s:"Der Baum ist sehr groß.",se:"The tree is very tall."},
{de:"klein",g:"",t:"adjective",en:"small",s:"Die Wohnung ist klein, aber gemütlich.",se:"The apartment is small but cosy."},
{de:"gut",g:"",t:"adjective",en:"good",s:"Das Essen schmeckt gut.",se:"The food tastes good."},
{de:"neu",g:"",t:"adjective",en:"new",s:"Ich brauche ein neues Handy.",se:"I need a new phone."},
{de:"alt",g:"",t:"adjective",en:"old",s:"Mein Großvater ist achtzig Jahre alt.",se:"My grandfather is eighty years old."},
{de:"schnell",g:"",t:"adjective",en:"fast",s:"Der Zug ist sehr schnell.",se:"The train is very fast."},
{de:"kalt",g:"",t:"adjective",en:"cold",s:"Heute ist es kalt.",se:"It is cold today."}
];
var i=0,prof={},filt="all";
try{prof=JSON.parse(localStorage.getItem("deProf")||"{}")}catch(e){}
try{var si=parseInt(localStorage.getItem("deIdx"),10);if(si>=0&&si<WORDS.length)i=si}catch(e){}
var $=function(id){return document.getElementById(id)};
var COL={1:"var(--die)",2:"#d69e2e",3:"var(--das)"};
var voice=null,started=false;
function pickVoice(){
  if(!window.speechSynthesis)return;
  var vs=speechSynthesis.getVoices();
  voice=vs.filter(function(v){return /^de/i.test(v.lang)})[0]||null;
}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(text){
  if(!window.speechSynthesis){$("sound").textContent="Sound isn’t supported in this browser.";return}
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="de-DE";if(voice)u.voice=voice;u.rate=.85;
    speechSynthesis.speak(u);
    $("sound").textContent=voice?"":"No German voice found on this device; using the default voice.";
  }catch(e){}
}
function full(w){return (w.g?w.g+" ":"")+w.de}
function vis(){var o=[];WORDS.forEach(function(w,x){if(filt==="all"||prof[w.de]!==3)o.push(x)});return o}
function render(playSound){
  var w=WORDS[i];
  $("card").classList.remove("open");
  $("word").textContent=w.de;
  var g=$("gender");
  if(w.g){g.style.display="";g.textContent=w.g;g.style.color="var(--"+w.g+")"}else g.style.display="none";
  $("type").textContent=w.t;
  $("tr").textContent=w.en;$("ex").textContent=w.s;$("exen").textContent=w.se;
  var p=prof[w.de]||0;
  $("dot").style.background=p?COL[p]:"var(--line)";
  Array.prototype.forEach.call($("prof").children,function(b){b.classList.toggle("sel",+b.dataset.p===p)});
  var o=vis(),n=o.indexOf(i)+1;$("pos").textContent=(n?n:"–")+" / "+o.length;
  $("bar").style.width=(o.length?n/o.length*100:0)+"%";
  var k=0;WORDS.forEach(function(x){if(prof[x.de]===3)k++});
  $("stats").textContent=k+" known";Array.prototype.forEach.call($("filt").children,function(b){b.classList.toggle("sel",b.dataset.f===filt)});
  try{localStorage.setItem("deIdx",i)}catch(e){}
  if(playSound)say(full(w));
}
function go(d){
  var o=vis();
  if(!o.length){render(false);return}
  var p=o.indexOf(i);
  if(p>=0)i=o[(p+d+o.length)%o.length];
  else if(d>0){i=o.filter(function(x){return x>i})[0];if(i===undefined)i=o[0]}
  else{var b=o.filter(function(x){return x<i});i=b.length?b[b.length-1]:o[o.length-1]}
  render(true);
}
$("next").onclick=function(){go(1)};
$("prev").onclick=function(){go(-1)};
$("card").onclick=function(e){
  if(e.target.closest("button"))return;
  if(!started){started=true;say(full(WORDS[i]))}
  $("card").classList.toggle("open");
};
$("speak").onclick=function(){started=true;say(full(WORDS[i]))};
$("speakEx").onclick=function(){say(WORDS[i].s)};
$("prof").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  prof[WORDS[i].de]=+b.dataset.p;
  try{localStorage.setItem("deProf",JSON.stringify(prof))}catch(err){}
  render(false);
};
$("filt").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  filt=b.dataset.f;
  var o=vis();
  if(!o.length){filt="all";$("sound").textContent="You’ve marked every word as Known. Nice!";render(false);return}
  if(o.indexOf(i)<0)i=o[0];
  render(false);
};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key===" "){e.preventDefault();$("card").classList.toggle("open")}
});
render(false);
$("sound").textContent="Tap 🔊 once to enable sound; after that it plays automatically.";
$("next").addEventListener("click",function(){$("sound").textContent=""});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
